name: Tests
on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: '0 17 * * 3' # every Wednesday at 5pm UTC = 1pm EDT

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    # Scheduled runs are gated to the main repo; non-schedule triggers run everywhere.
    if: github.event_name != 'schedule' || github.repository == 'NCATSTranslator/Babel'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # A plain checkout fetches no tags. `releases/scripts/draft_release_notes.py:is_tag()`
          # asks the checkout whether a build was tagged, and renders "untagged in this repository"
          # when it wasn't -- so without this the release-note tests see a different repository than
          # a developer does: the tagged-build assertion fails, and the untagged-build one passes
          # for the wrong reason, since with no tags at all every build looks untagged.
          fetch-tags: true
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run pytest --collect-only -q
      - run: uv run pytest -m unit --no-cov -q

  network-tests:
    runs-on: ubuntu-latest
    # Run on manual dispatch anywhere, but only on schedule in the main repo (not forks).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.repository == 'NCATSTranslator/Babel')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # A plain checkout fetches no tags. `releases/scripts/draft_release_notes.py:is_tag()`
          # asks the checkout whether a build was tagged, and renders "untagged in this repository"
          # when it wasn't -- so without this the release-note tests see a different repository than
          # a developer does: the tagged-build assertion fails, and the untagged-build one passes
          # for the wrong reason, since with no tags at all every build looks untagged.
          fetch-tags: true
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run pytest --network -m "unit or network or slow" --no-cov -q
